<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay ₹260</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    h1 {
      margin: 0 0 10px;
      color: #222;
    }

    .amount {
      font-size: 42px;
      font-weight: bold;
      color: #1a73e8;
      margin: 20px 0;
    }

    .upi {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .pay-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .pay-button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Payment</h1>

    <div class="amount">₹260</div>

    <div class="upi">
      UPI ID: 9850672020@ybl
    </div>

    <a
      class="pay-button"
      href="upi://pay?pa=9850672020%40ybl&pn=Payment&am=260&cu=INR">
      💳 Pay ₹260 Now
    </a>

    <div class="note">
      Tap the button to open your UPI app.<br>
      ₹260 will be pre-filled.
    </div>

  </div>

</body>
</html>
